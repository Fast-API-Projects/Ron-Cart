name: Event Demo 1
on:
  push:
    branches:
      - main

jobs:
  test:
    name : test
    runs-on: ubuntu-latest
    steps:
      - name: test run
        run: echo "testingggg....."

  build:
    name : build
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: install dependencies
        run: pip install -r requirements.txt


  build-and-push-container-image:
    needs:
      - test
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name : Build-and-push-image
        uses : docker/build-push-action@v6
        with:
          context: .
          push : true
          tags : |
            ${{ secrets.DOCKERHUB_USERNAME }}/ron-cart-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ron-cart-api:${{ github.sha }}
            
  deploy-to-openshift:
      needs:
        - build-and-push-container-image
      runs-on: ubuntu-latest

      steps:
        - name : Install Openshift CLI
          uses : redhat-actions/openshift-tools-installer@v1
          with:
            oc : 4

        - name : login to Openshift
          uses : redhat-actions/oc-login@v2
          with:
            openshift_server_url: ${{ secret.OPENSHIFT_SERVER }}
            openshift_token: ${{ secret.OPENSHIFT_TOKEN }}
            namespace: ${{ secret.OPENSHIFT_NAMESPACE }}

        - name: verify openshift connection
          run : |
            oc whoami
            oc project

        - name: update deployment image
          run : |
            oc set image deployment/rony-cart-api \ ron-cart-api=docker.io/${{ secret.DOCKERHUB_USERNAME }}/ron-cart-api:${ GITHUB_SHA }

        - name: wait for deployment rollout
          run : |
            oc rollout status deployment/rony-cart-api --timeout=180s

        - name: verify deployment
          run : |
            oc get deployment rony-cart-api
            oc get pods
            oc get routeds


            
            
            
