name: Event Demo 1
on:
  push:
    branches:
      - main
      - G_Nigga

jobs:
  test:
    name : test
    runs-on: ubuntu-latest
    steps:
      - name: test run
        run: echo "testingggg....."

  build:
    needs:
      - test
    name : build
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: install dependencies
        run: pip install -r requirements.txt


  build-and-push-container-image:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name : Build-and-push-image
        uses : docker/build-push-action@v6
        with:
          context: .
          push : true
          tags : |
            ${{ secrets.DOCKERHUB_USERNAME }}/ron-cart-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ron-cart-api:${{ github.sha }}
            
  deploy-to-openshift:
      needs:
        - build-and-push-container-image
      runs-on: ubuntu-latest

      steps:
        - name : Install Openshift CLI
          uses : redhat-actions/openshift-tools-installer@v1
          with:
            oc : 4

        - name : login to Openshift
          uses : redhat-actions/oc-login@v2
          with:
            openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
            openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
            namespace: ${{ secrets.OPENSHIFT_NAMESPACE }}

        - name: verify openshift connection
          run : |
            oc whoami
            oc project

        - name: Diagnose OpenShift resources
          run: |
            echo "Current identity:"
            oc whoami

            echo "Current project:"
            oc project

            echo "Available deployments:"
            oc get deployments

            echo "Checking rony-cart-api deployment:"
            oc get deployment rony-cart-api --ignore-not-found

            echo "Available services:"
            oc get services

            echo "Available routes:"
            oc get routes

        - name: create or update deployment
          run : |
            IMAGE="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ron-cart-api:${{ github.sha }}"
            
            if oc get deployment rony-cart-api >/dev/null 2>&1; then
              echo "Deployment exits updating image........"
              oc set image deployment/rony-cart-api \
              rony-cart-api="${IMAGE}"
            else
              echo "Deployment does not exist. Creating deployment........"
              oc create deployment rony-cart-api \
              --image="${IMAGE}" \
              --port=8000
            fi

        - name: wait for deployment rollout
          run : |
            oc rollout status deployment/rony-cart-api --timeout=180s

        - name: verify deployment
          run : |
            oc get deployment rony-cart-api
            oc get pods
            oc get routes


            
            
            
