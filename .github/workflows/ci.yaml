name: Event Demo 1
on: #Triggering events
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: test run
        run: echo "testingggg....."

  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: install dependencies
        run: pip install -r requirements.txt

  build-and-push-container-image:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup docker build
        uses: docker/setup-buildx-action@v3

      - name: login docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_RONY_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_RONY_TOKEN }}
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            {{ secrets.DOCKER_HUB_RONY_USERNAME }}/ron-cart:latest
            {{ secrets.DOCKER_HUB_RONY_USERNAME }}/ron-cart:${{ github.sha }}





